server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: agregateur-transporteurs

  datasource:
    url: jdbc:postgresql://localhost:5432/agregateur_transporteurs
    username: postgres
    password: postgresql
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false
      separator: ";;"          # ← clé du problème

application:
  security:
    jwt:
      secret-key: 4e6f4d6f726546616b654b657973506c65617365546869734973466f7254657374
      expiration: 86400000
      refresh-token:
        expiration: 604800000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.agregateur.transporteurs: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE